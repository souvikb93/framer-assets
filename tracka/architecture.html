const tokBg=mk('circle',{r:13,fill:BRAND,stroke:'#fff','stroke-width':2.5,filter:'url(#lift)'},tok);
const tokIcon=mk('g',{transform:'translate(-6.5,-6.5) scale(.54)',fill:'none',stroke:'#fff','stroke-width':2.8,'stroke-linecap':'round','stroke-linejoin':'round'},tok);
let cur,seq,i,phase,t,dur,hidden=false,hover=false,path=null,pathL=0,lastNow=0,dash=0,tokSc=1,tokPt=[0,0];
function movePill(){const b=document.querySelector('.opt.on');if(!b)return;
 const p=$('pill');p.style.width=b.offsetWidth+'px';p.style.height=b.offsetHeight+'px';
 p.style.transform=`translate(${b.offsetLeft-p.offsetLeft}px,${b.offsetTop-p.offsetTop}px)`}
function readout(id,s){const r=$('read');r.style.setProperty('--sw',CO(id));
 r.querySelector('b').textContent=NAME[id];r.querySelector('span').textContent=s;
 const c=r.querySelector('code');c.textContent=API[id];c.title=API[id];r.querySelector('span').title=s}
function milestones(){return seq.map((s,j)=>({s,j})).filter(o=>o.s[3])}
function renderSteps(){const ms=milestones();
 $('steps').innerHTML=ms.map((o,k)=>`${k?'<span class="sep" data-j="'+o.j+'" data-p="'+ms[k-1].j+'"></span>':''}<span class="s" data-j="${o.j}"><span class="dot"></span><span class="lb">${o.s[3].replace(' ','<br>')}</span></span>`).join('')}
function paintSeps(){const q=Math.min(1,dur?t/dur:1),pos=phase==='move'?(i-1)+q:i;
 $('steps').querySelectorAll('.sep').forEach(el=>{const j=+el.dataset.j,jp=+el.dataset.p;
  el.style.setProperty('--f',(Math.max(0,Math.min(1,(pos-jp)/(j-jp)))*100).toFixed(1)+'%')})}
function markSteps(){const fin=j=>j<i||(j===i&&(phase==='done'||phase==='end'));
 $('steps').querySelectorAll('.s').forEach(el=>{const j=+el.dataset.j,d=fin(j),now=!d&&j===i&&(phase==='work'||phase==='move'||phase==='land');
  el.classList.toggle('done',d);el.classList.toggle('now',now)});paintSeps()}
function focusRoute(){const ue=new Set(),un=new Set(seq.map(s=>s[0]));
 for(let j=1;j<seq.length;j++)ue.add(edgeOf(seq[j-1][0],seq[j][0])[0]);
 for(const k in EL){const u=ue.has(k);EL[k].setAttribute('stroke',u?'#C9C6BF':NEU);EL[k].setAttribute('opacity',u?1:.34)}
 for(const id in G)G[id].style.opacity=un.has(id)?1:.34}
function placeTok(pt){tokPt=pt;tok.setAttribute('transform',`translate(${pt[0]},${pt[1]}) scale(${tokSc})`);halo.setAttribute('cx',pt[0]);halo.setAttribute('cy',pt[1])}
function showTok(v){tokSc=1;placeTok(tokPt);tok.setAttribute('opacity',v?1:0);if(!v)halo.setAttribute('opacity',0)}
function start(k){cur=k;seq=F[k];i=0;trail.innerHTML='';flow.innerHTML='';
 document.querySelectorAll('.opt').forEach(b=>{const on=b.dataset.k===k;b.classList.toggle('on',on);b.setAttribute('aria-selected',on)});
 movePill();for(const id in N)nodeState(id,'idle');focusRoute();renderSteps();
 tokIcon.innerHTML=ICON[seq[0][4]];placeTok([N.user.x,N.user.y]);showTok(false);
 readout('user',seq[0][1]);phase='done';t=0;dur=reduce?.01:.6;markSteps()}
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
function next(){if(i>=seq.length-1){phase='end';t=0;dur=END;markSteps();return}
 const [ek,rev]=edgeOf(seq[i][0],seq[i+1][0]),a=N[seq[i][0]],b=N[seq[i+1][0]];
 const pts=[[a.x,a.y],...(rev?E[ek].slice().reverse():E[ek]),[b.x,b.y]],d=rpath(pts,HOPS[ek]);
 const from=CO(seq[i][0]),col=CO(seq[i+1][0]),g=$('flowg');
 g.setAttribute('x1',pts[0][0]);g.setAttribute('y1',pts[0][1]);g.setAttribute('x2',pts[pts.length-1][0]);g.setAttribute('y2',pts[pts.length-1][1]);
 $('gs0').setAttribute('stop-color',from);$('gs1').setAttribute('stop-color',col);
 path=mk('path',{d,fill:'none',stroke:'url(#flowg)','stroke-width':2.6,'stroke-linecap':'round','stroke-linejoin':'round'},trail);
 flow.innerHTML='';mk('path',{d,fill:'none',stroke:'url(#flowg)','stroke-width':2.6,'stroke-linecap':'round',opacity:.35,'stroke-dasharray':'1 13'},flow);
 tokBg.setAttribute('fill',col);halo.setAttribute('fill',col);
 pathL=path.getTotalLength();path.style.strokeDasharray=`${pathL} ${pathL}`;path.style.strokeDashoffset=pathL;
 i++;phase='move';t=0;dur=reduce?.01:Math.max(1.1,pathL/SPEED);
 tokIcon.innerHTML=ICON[seq[i][4]];placeTok(pts[0]);showTok(true);readout(seq[i][0],seq[i][1]);markSteps()}
function frame(now){const dt=Math.min(.05,(now-(lastNow||now))/1000);lastNow=now;
 for(const id in N){const n=N[id];
  if(reduce){n.sc=n.target}else{const k=150,c=2*Math.sqrt(k)*.78;n.vel+=((n.target-n.sc)*k-n.vel*c)*dt;n.sc+=n.vel*dt}
  if(Math.abs(n.sc-1)>0.0015)GI[id].setAttribute('transform',`translate(${n.x},${n.y}) scale(${n.sc.toFixed(4)}) translate(${-n.x},${-n.y})`);
  else GI[id].removeAttribute('transform')}
 if(!hidden&&!hover&&seq){t+=dt;const p=Math.min(1,t/dur),id=seq[i][0];
  if(phase==='move'){const d=pathL*ease(p),q=path.getPointAtLength(d);placeTok([q.x,q.y]);path.style.strokeDashoffset=pathL-d;
   dash=(dash-dt*46)%14;flow.firstChild&&flow.firstChild.setAttribute('stroke-dashoffset',dash);
   halo.setAttribute('opacity',(.14*Math.sin(t*6)+.16).toFixed(3));halo.setAttribute('r',(20+3*Math.sin(t*6)).toFixed(2));
   if(p>=1){phase='land';t=0;dur=reduce?.01:.3;N[id].target=1.3;tok.setAttribute('opacity',1)}}
  else if(phase==='land'){const u=p;
   tokSc=Math.max(0,u<.32?1+.34*(u/.32):1.34*(1-ease((u-.32)/.68)));placeTok(tokPt);
   tok.setAttribute('opacity',u<.58?1:Math.max(0,1-(u-.58)/.42).toFixed(3));
   halo.setAttribute('opacity',(.3*(1-u)).toFixed(3));halo.setAttribute('r',(12+26*u).toFixed(1));
   if(p>=1){showTok(false);phase='work';t=0;dur=reduce?1.2:seq[i][3]?WORK_KEY:WORK;nodeState(id,'work',0);markSteps()}}
  else if(phase==='work'){nodeState(id,'work',p);halo.setAttribute('opacity',0);
   if(p>=1){phase='done';t=0;dur=HOLD;nodeState(id,'done');readout(id,seq[i][2]);
    if(path){path.setAttribute('stroke',BRAND);path.setAttribute('stroke-opacity',.5);path.setAttribute('stroke-width',2)}
    flow.innerHTML='';markSteps()}}
  else if(phase==='done'){if(p>=1)next()}
  else if(phase==='end'){if(p>=1)start(ORDER[(ORDER.indexOf(cur)+1)%ORDER.length])}
  paintSeps()}
 requestAnimationFrame(frame)}
$('pick').onclick=e=>{const b=e.target.closest('.opt');if(b){start(b.dataset.k);setTimeout(movePill,0)}};
$('svg').addEventListener('mouseenter',()=>{hover=true});
$('svg').addEventListener('mouseleave',()=>{hover=false});
addEventListener('resize',movePill);
document.addEventListener('visibilitychange',()=>{hidden=document.hidden});
start('onboard');requestAnimationFrame(frame);
if(document.fonts)document.fonts.ready.then(movePill);
if(window.ResizeObserver)new ResizeObserver(movePill).observe($('pick'));
</script></body></html>
