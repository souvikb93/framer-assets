<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:'Uncut Sans';src:url(https://cdn.jsdelivr.net/gh/kaspernordkvist/uncut_sans@b3b42467781e3bd98c68f2d70eba325196e7d9c5/Webfonts/UncutSans-Variable.woff2) format('woff2');font-weight:300 700;font-style:normal;font-display:swap}
:root{--t-display:40px;--t-title-lg:24px;--t-title:18px;--t-body:14px;--t-caption:12px;--t-micro:10px;--r-surface:24px;--r-card:16px;--r-inner:12px;--r-node:8px;--r-xs:4px;--r-pill:999px}
@media (max-width:1023px){:root{--t-display:30px;--t-title-lg:18px;--t-title:16px}}
@media (max-width:767px){:root{--t-display:22px;--t-title-lg:16px;--t-title:15px}}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;background:transparent;font-family:'Uncut Sans',-apple-system,sans-serif;color:#121212;-webkit-font-smoothing:antialiased}
body{display:block!important}body>div{width:100%}

.wrap{padding:4px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.col{background:#fff;border:1px solid #E5E5E5;border-radius:var(--r-card);overflow:hidden;display:flex;flex-direction:column;opacity:0;transform:translateY(8px);animation:in .45s ease forwards}
.col:nth-child(2){animation-delay:.07s}.col:nth-child(3){animation-delay:.14s}
.hd{background:#0672CB;color:#fff;padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.hd em{font-style:normal;font-size:var(--t-micro);font-weight:600;letter-spacing:.02em;color:#F2F8FD}
.hd b{font-size:var(--t-title);font-weight:600;line-height:1.3}
.bd{padding:16px 18px;display:flex;flex-direction:column;gap:12px;flex:1}
.sub{font-size:var(--t-caption);line-height:1.45;color:#696970}
.pts{list-style:none;display:flex;flex-direction:column;gap:9px}
.pts li{font-size:var(--t-body);line-height:1.45;color:#121212;padding-left:16px;position:relative}
.pts li::before{content:"";position:absolute;left:1px;top:8px;width:6px;height:6px;border-radius:50%;background:#7DB9EA}
.ev{margin-top:auto;border-top:1px solid #E5E5E5;padding:14px 18px;display:flex;flex-direction:column;gap:4px}
.ev em{font-style:normal;font-size:var(--t-micro);font-weight:600;letter-spacing:.02em;color:#696970}
.ev p{font-size:var(--t-caption);line-height:1.45;color:#454548}

@keyframes in{to{opacity:1;transform:none}}
@media (max-width:820px){.wrap{grid-template-columns:1fr}}
@media (max-width:440px){.wrap{gap:12px}.hd{padding:12px 12px}.bd{padding:12px 12px}.ev{padding:10px 12px}}
@media (prefers-reduced-motion:reduce){.col{animation:none;opacity:1;transform:none}}
@media (min-width:900px){body{min-height:305px}}
</style></head><body>
<div class="wrap" id="w"></div>
<script>
const O=[
 ['Option 01','One Global Process','One flow for every country',
  ['Simplest model','Same rules everywhere','Limited flexibility for regional requirements'],
  'Consistency at the cost of local adaptability.'],
 ['Option 02','One Tool Per Country','Fully localized experiences',
  ['Maximum regional flexibility','Country-specific workflows','Separate flows to maintain'],
  'Local flexibility recreates fragmentation and increases maintenance.'],
 ['Option 03','Shared Core + Local Rules','One framework, configurable by region',
  ['Five modules stay consistent','Regional rules sit on top','New countries are configured rather than redesigned'],
  'Requires a clear rule model and governance.']];
document.getElementById('w').innerHTML=O.map(o=>`<div class="col">
 <div class="hd"><em>${o[0]}</em><b>${o[1]}</b></div>
 <div class="bd"><p class="sub">${o[2]}</p>
  <ul class="pts">${o[3].map(p=>`<li>${p}</li>`).join('')}</ul></div>
 <div class="ev"><em>Trade-off</em><p>${o[4]}</p></div>
</div>`).join('');
</script>
</body></html>
