<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"> <style>
@font-face{font-family:'Uncut Sans';src:url(https://cdn.jsdelivr.net/gh/kaspernordkvist/uncut_sans@b3b42467781e3bd98c68f2d70eba325196e7d9c5/Webfonts/UncutSans-Variable.woff2) format('woff2');font-weight:300 700;font-style:normal;font-display:swap}
:root{--t-display:40px;--t-title-lg:24px;--t-title:18px;--t-body:14px;--t-caption:12px;--t-micro:10px;--r-surface:24px;--r-card:16px;--r-inner:12px;--r-node:8px;--r-xs:4px;--r-pill:999px}
@media (max-width:1023px){:root{--t-display:30px;--t-title-lg:18px;--t-title:16px}}
@media (max-width:767px){:root{--t-display:22px;--t-title-lg:16px;--t-title:15px}}

 html,body{width:100%}body{display:block!important}body>div{width:100%} *{margin:0;padding:0;box-sizing:border-box} html,body{background:transparent;font-family:'Uncut Sans',-apple-system,sans-serif;color:#121212;-webkit-font-smoothing:antialiased} .label{font-size:var(--t-caption);font-weight:600;letter-spacing:.02em;color:#696970}  .wrap{padding:4px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px} .col{background:#fff;border:1px solid #E5E5E5;border-radius:var(--r-card);overflow:hidden;display:flex;flex-direction:column} .hd{background:#0672CB;color:#fff;padding:14px 16px;display:flex;flex-direction:column;justify-content:center;gap:3px;min-height:92px} .hd em{font-style:normal;font-size:var(--t-micro);font-weight:600;letter-spacing:.02em;color:#F2F8FD} .hd b{font-size:var(--t-title);font-weight:600;line-height:1.3} .bd{padding:14px 16px;display:flex;flex-direction:column;gap:8px;flex:1} .bd .label{font-size:var(--t-micro)} .mv{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:10px 12px;border-radius:var(--r-inner);background:#F2F8FD;border:1px solid #C8E3F7} .mod{font-size:var(--t-caption);font-weight:600;color:#0063B8;line-height:1.3} .mv p{font-size:var(--t-body);line-height:1.45;color:#0063B8} @media (max-width:820px){.wrap{grid-template-columns:1fr}} 
@media (min-width:900px){body{min-height:413px}}
@media (max-width:440px){.wrap{gap:12px}.hd{padding:12px 12px;min-height:0}.bd{padding:12px 12px}.mv{padding:10px 10px}}</style></head><body> <div class="wrap" id="w"></div> <script>
const C=[
 ['Enable Greater Autonomy',[
  ['Let customers start and manage requests with less agent dependency.','Create & Edit'],
  ['Automate routine approvals while routing only exceptions for review.','Verify & Review'],
  ['Give customers and agents a shared view of request status and history.','Process & Track']]],
 ['Augment Human Decision-Making',[
  ['Bring relevant order, product, policy, and request data together.','Create & Edit \u00b7 BIL / SODS \u00b7 PDSL'],
  ['Surface the right rules and context at the moment of decision.','Verify & Review'],
  ['Focus human attention on exceptions rather than routine cases.','Verify & Review']]],
 ['Clear and Predictable Communication',[
  ['Give customers and agents a shared, consistent view of progress.','Process & Track'],
  ['Communicate key milestones and status changes automatically.','Process & Track \u00b7 Channels'],
  ['Make refund triggers, timelines, and next steps clear.','Process & Track \u00b7 Disposition & Recovery']]]];
document.getElementById('w').innerHTML=C.map((c,k)=>`<div class="col"><div class="hd"><em>Opportunity 0${k+1}</em><b>${c[0]}</b></div><div class="bd"><div class="label">What We Designed</div>${c[1].map(m=>`<div class="mv"><span class="mod">${m[1]}</span><p>${m[0]}</p></div>`).join('')}</div></div>`).join('');
</script></body></html>
